services:
  miru:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_PROXY_URL=/api/proxy
      - NEXT_PUBLIC_POCKETBASE_URL=http://localhost:8090

  proxy:
    image: dovakiin0/proxy-m3u8:latest
    ports:
      - "4040:4040"
    environment:
      - PORT=4040
      - CORS_DOMAIN=http://localhost:3000
